name: CI

on:
  push:
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # musl-tools: the userland test programs are built for Linux with
      # musl-gcc, exactly as a Linux user would build them.
      - name: Install QEMU, OVMF and musl
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf musl-tools
      - name: Allow KVM (faster QEMU)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: |
          cargo clippy -p xtask -- -D warnings
          cargo clippy -p segboot --target x86_64-unknown-uefi -- -D warnings
          cargo clippy -p segkernel --target x86_64-unknown-none -- -D warnings
      - name: Kernel tests in QEMU
        run: cargo xtask test
      # Optimised code exposes bugs (inline asm register sharing, UB) that
      # debug builds hide.
      - name: Kernel tests in QEMU, release build
        run: cargo xtask test --release
      - name: Bootable disk image
        run: cargo xtask image --release
      - uses: actions/upload-artifact@v5
        with:
          name: segos-img
          path: target/segos.img
